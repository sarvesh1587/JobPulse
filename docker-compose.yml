# Full stack in containers: PostgreSQL + Spring Boot API + nginx serving the SPA.
#   cp .env.example .env    (then set the secrets)
#   docker compose up --build
# Then open http://localhost:8081
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobpulse
      POSTGRES_USER: jobpulse
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpulse -d jobpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/jobpulse
      DB_USERNAME: jobpulse
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Plain-http local compose needs false. Behind HTTPS in production, use true.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:-jobpulse-demo}
      CORS_ALLOWED_ORIGINS: http://localhost:8081
    volumes:
      - resumes:/app/data/resumes
    # Not published: only reachable through the frontend's nginx proxy.
    expose:
      - "8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  pg_data:
  resumes:
