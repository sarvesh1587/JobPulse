# Local development profile (the default when no profile is set).

jobpulse:
  auth:
    cookie-secure: false   # local dev runs over plain http://localhost
  demo-data:
    # Demo employers, jobs and accounts (DevDataSeeder). Local use only.
    enabled: true
    password: ${DEV_SEED_PASSWORD:jobpulse-demo}
    include-admin: true

logging:
  level:
    com.jobpulse: DEBUG
