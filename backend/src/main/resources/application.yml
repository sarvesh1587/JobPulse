# Shared settings. Secrets and environment-specific values come from
# environment variables (see backend/.env.example). The defaults here are
# only safe local fallbacks.

spring:
  application:
    name: jobpulse-backend
  profiles:
    default: dev
  # Loads backend/.env (KEY=value lines) when it exists, so local runs don't
  # need the variables exported in the shell. Real environment variables win.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobpulse}
    username: ${DB_USERNAME:jobpulse}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks the entities match it
    open-in-view: false    # no lazy loading during JSON rendering: services return fully built DTOs
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50   # lazy collections load in batches instead of one query per row

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: ${RESUME_MAX_SIZE_MB:5}MB
      max-request-size: ${RESUME_MAX_SIZE_MB:5}MB

  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  # Trust X-Forwarded-For only from internal proxies (our nginx), so the
  # rate limiter sees the real client IP and clients can't spoof it.
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

jobpulse:
  auth:
    jwt-secret: ${JWT_SECRET:}
    token-ttl: ${AUTH_TOKEN_TTL:12h}
    cookie-name: JOBPULSE_AUTH
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    rate-limit-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
  resume:
    storage-dir: ${RESUME_STORAGE_DIR:./data/resumes}
    max-size-bytes: ${RESUME_MAX_SIZE_BYTES:5242880}
  matching:
    weights:
      skills: 0.40
      experience: 0.20
      education: 0.15
      location: 0.10
      freshness: 0.10
      job-type: 0.05
  ingestion:
    # Off by default: nothing calls an external job board until you add targets.
    enabled: ${INGESTION_ENABLED:false}
    fixed-delay-minutes: ${INGESTION_INTERVAL_MINUTES:60}
    targets: []
    # The slug is the company's id in its careers URL:
    # boards.greenhouse.io/{slug}, jobs.lever.co/{slug}, jobs.ashbyhq.com/{slug}
    # targets:
    #   - source: GREENHOUSE
    #     slug: some-company

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui
    csrf:
      enabled: true
  default-produces-media-type: application/json

logging:
  level:
    com.jobpulse: INFO
