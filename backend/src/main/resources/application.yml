spring:
  application:
    name: jobpulse-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobpulse}
    username: ${DB_USERNAME:jobpulse}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: ${RESUME_MAX_SIZE_MB:5}MB
      max-request-size: ${RESUME_MAX_SIZE_MB:5}MB

server:
  port: ${SERVER_PORT:8080}

jobpulse:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-minutes: 30
    refresh-token-days: 14
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  resume:
    storage-dir: ${RESUME_STORAGE_DIR:./data/resumes}
    max-size-bytes: ${RESUME_MAX_SIZE_BYTES:5242880}   # 5 MB
  matching:
    weights:
      skills: 0.40
      experience: 0.20
      education: 0.15
      location: 0.10
      freshness: 0.10
      job-type: 0.05
  ingestion:
    enabled: ${INGESTION_ENABLED:false}
    fixed-delay-minutes: ${INGESTION_INTERVAL_MINUTES:60}
    targets: []
    # Add companies to track once you've confirmed the slug is correct — the
    # slug is whatever appears in the company's own careers URL, e.g.
    # boards.greenhouse.io/{slug}, jobs.lever.co/{slug}, jobs.ashbyhq.com/{slug}.
    # Example (uncomment and adjust):
    # targets:
    #   - source: GREENHOUSE
    #     slug: some-company-slug
    #   - source: LEVER
    #     slug: some-company-slug
    #   - source: ASHBY
    #     slug: some-company-slug

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui

logging:
  level:
    com.jobpulse: INFO
    org.springframework.security: WARN
