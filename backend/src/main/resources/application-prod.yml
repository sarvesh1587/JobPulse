# Production profile: SPRING_PROFILES_ACTIVE=prod

jobpulse:
  auth:
    cookie-secure: true

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  structured:
    format:
      console: ecs   # one JSON object per log line, ready for a log aggregator
  level:
    com.jobpulse: INFO
