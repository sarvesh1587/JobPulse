# Test profile. The datasource comes from IntegrationTest (embedded PostgreSQL),
# which takes precedence over anything in a developer's backend/.env.
jobpulse:
  auth:
    jwt-secret: test-only-secret-that-is-long-enough-for-hs256-signing
    cookie-secure: false
    rate-limit-per-minute: 1000
  resume:
    storage-dir: ${java.io.tmpdir}/jobpulse-test-resumes

logging:
  level:
    com.jobpulse: INFO
    org.flywaydb: WARN
