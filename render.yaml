# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Values marked sync: false are secrets that Render asks for on first deploy.
# They are never stored in git. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: jobpulse
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Neon connection, JDBC form: jdbc:postgresql://<host>/<db>?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      # Random 256-bit signing key generated by Render
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      # Your private admin account (password: 12+ characters)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Public demo employers, jobs and a demo candidate. Shared password; no demo admin.
      - key: DEMO_DATA_ENABLED
        value: "true"
      - key: DEMO_DATA_PASSWORD
        sync: false
